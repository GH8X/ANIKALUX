<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6E1529" />

    <title>Al-Aniqa Lux | Wholesale Clothing &amp; Luxury Pajamas</title>
    <meta
      name="description"
      content="Al-Aniqa Lux is an Algerian fashion wholesale brand specialising in elegant clothing and premium luxury pajamas for boutiques, resellers and wholesale customers."
    />
    <meta
      name="keywords"
      content="wholesale clothing Algeria, luxury pajamas, vêtements en gros Algérie, pyjamas de luxe, ملابس بالجملة الجزائر, بيجامات فاخرة, Al-Aniqa Lux"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Al-Aniqa Lux" />
    <!-- __SITE_URL__ is stamped at build time (see stampSiteUrl in vite.config.ts).
         Canonical and Open Graph urls must be absolute for crawlers. -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al-Aniqa Lux" />
    <meta property="og:title" content="Al-Aniqa Lux | Wholesale Clothing &amp; Luxury Pajamas" />
    <meta
      property="og:description"
      content="Premium clothing and luxury pajamas available at wholesale prices. Serving boutiques and resellers across Algeria."
    />
    <meta property="og:image" content="__SITE_URL__/brand/logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Al-Aniqa Lux | Wholesale Clothing &amp; Luxury Pajamas" />
    <meta
      name="twitter:description"
      content="Premium clothing and luxury pajamas available at wholesale prices."
    />
    <meta name="twitter:image" content="__SITE_URL__/brand/logo.png" />

    <!-- Fallback mark. LogoFavicon swaps these for the official logo once one
         is published, so the URL is never hard-coded. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Al-Aniqa Lux",
        "alternateName": "الأنيقة Lux",
        "description": "Algerian fashion wholesale brand specialising in elegant clothing and premium pajamas.",
        "logo": "__SITE_URL__/brand/logo.png",
        "areaServed": { "@type": "Country", "name": "Algeria" },
        "knowsLanguage": ["en", "fr", "ar"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
