# Minimal CI for the admin-portal work: mirror the two checks that are run
# locally before committing (`bun run typecheck`, `bun run build`).
#
# The build scripts invoke `node` explicitly rather than a bare `vite`
# (see README → "Build script"), so a predictable Node runtime matters as
# much as Bun does here.
name: CI

on:
  push:
    branches:
      - feat/admin-portal-cms

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --frozen-lockfile also fails the run if bun.lock is out of step with
      # package.json, which was the cause of an earlier deploy failure.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
